# Service to use: 'groq' or 'openai' or 'huggingface' or 'ollama'
service: 'openai'
# Groq or OpenAI models
model: 'gpt-3.5-turbo' #'llama3.1:8b' #'gemma3:1b' #'gemma2-9b-it' #'gemma3:1b' #'gpt-3.5-turbo' 
seed: 173
size: 7
num_steps: 5
max_tokens: 2
show_viz: False
generate_image: False
prompt_type: 'nr1' #'old'  # can be 'standard' or 'explicit'
temperature: 
  - 0.4



